<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fun Phone — Campaign Studio</title>
  <style>
    @font-face{font-family:Sans;font-weight:200 800;src:url('/fonts/display.woff2')}
    @font-face{font-family:Serif;font-style:normal;src:url('/fonts/serif.woff2')}
    @font-face{font-family:Serif;font-style:italic;src:url('/fonts/serif-italic.woff2')}
    *{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{font-family:Sans,Arial,sans-serif}
    .poster{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);background:var(--bg)}
    .copy{position:absolute;z-index:3;left:84px;right:84px;top:80px}
    .copy h1{font-family:Serif,Georgia,serif;font-weight:400;font-size:112px;line-height:.94;letter-spacing:-2.2px;margin:0}
    .copy h1 span{display:block;white-space:nowrap}.copy h1 span+span{font-style:italic;color:var(--accent)}
    .copy p{font-size:30px;line-height:1.3;letter-spacing:-.3px;margin:16px 0 0;font-weight:400;opacity:.72;white-space:nowrap}
    .screen{position:absolute;margin:0;padding:9px;border-radius:66px;background:#151515;box-shadow:0 0 0 1.5px rgba(0,0,0,.18),0 40px 70px -30px rgba(28,24,20,.45),0 8px 18px -6px rgba(28,24,20,.18)}
    .dark .screen{box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 40px 80px -30px rgba(0,0,0,.7)}
    .screen img{width:100%;height:auto;display:block;border-radius:57px}
    .screen figcaption{display:none}
    .full .primary{left:209px;top:430px;width:662px}
    .bleed .primary{left:150px;top:440px;width:780px;padding:10px;border-radius:76px}.bleed .primary img{border-radius:66px}
    .pair .primary{left:452px;top:430px;width:600px;z-index:2}.pair .secondary{left:28px;top:560px;width:540px;z-index:1}
    .trio .primary{left:300px;top:450px;width:480px;z-index:2}
    .trio .secondary,.trio .tertiary{top:620px;width:420px;padding:7px;border-radius:52px;z-index:1}.trio .secondary img,.trio .tertiary img{border-radius:45px}
    .trio .secondary{left:-60px}.trio .tertiary{left:720px}
    .trio .screen figcaption{display:block;position:absolute;left:0;right:0;bottom:-58px;text-align:center;font:500 27px Sans,sans-serif;letter-spacing:-.2px;color:var(--ink);opacity:.72}
    .feature{width:1024px;height:500px}.feature .copy{left:64px;right:auto;top:118px;width:520px}
    .feature .copy h1{font-size:76px;letter-spacing:-1.6px;line-height:.98}.feature .copy p{font-size:22px;margin-top:20px;white-space:normal;text-wrap:balance;max-width:470px}
    .feature .screen{padding:4px;border-radius:30px}.feature .screen img{border-radius:26px}
    .feature .primary{left:768px;top:56px;width:226px;z-index:2}.feature .secondary{left:616px;top:118px;width:212px;z-index:1}
  </style>
</head>
<body>
  <main id="poster" class="poster">
    <div class="copy"><h1></h1><p></p></div>
    <figure class="screen secondary" hidden><img alt="" /><figcaption></figcaption></figure>
    <figure class="screen tertiary" hidden><img alt="" /><figcaption></figcaption></figure>
    <figure class="screen primary"><img alt="" /><figcaption></figcaption></figure>
  </main>
  <script>
    const campaign = CAMPAIGN_DATA;
    const query = new URLSearchParams(location.search);
    const lang = query.get('lang') || campaign.export.locales[0];
    if (!campaign.export.locales.includes(lang)) throw new Error('Unsupported campaign locale');
    const isFeature = query.has('feature');
    const slide = campaign.slides[Number(query.get('slide') || 0)];
    const poster = document.querySelector('#poster');
    const theme = isFeature ? campaign.feature.theme : slide.theme;
    document.documentElement.lang = lang;
    poster.style.setProperty('--bg', theme.bg);poster.style.setProperty('--ink', theme.ink);poster.style.setProperty('--accent', theme.accent);
    const luminance=parseInt(theme.bg.slice(1,3),16)*.299+parseInt(theme.bg.slice(3,5),16)*.587+parseInt(theme.bg.slice(5,7),16)*.114;
    if (isFeature) {
      for (const node of [document.documentElement, document.body]) { node.style.width='1024px'; node.style.height='500px'; }
      poster.className='poster feature';
    } else poster.className='poster '+slide.layout+(luminance<110?' dark':'');
    const h1=document.querySelector('h1');
    for(const text of (isFeature ? campaign.slides[0] : slide).headline[lang]){const line=document.createElement('span');line.textContent=text;h1.appendChild(line);}
    const subtitle=document.querySelector('.copy p');
    subtitle.textContent=isFeature ? campaign.feature.subtitle[lang] : slide.subtitle[lang];
    const show=(selector,scene,caption)=>{const figure=document.querySelector(selector);figure.hidden=false;figure.querySelector('img').src='/raw/'+lang+'/'+scene+'.png';figure.querySelector('figcaption').textContent=caption||'';};
    const captions=(slide.captions||{})[lang]||[];
    if(isFeature){show('.primary',campaign.feature.scenes[0]);show('.secondary',campaign.feature.scenes[1]);}
    else if(slide.trio){show('.secondary',slide.trio[0],captions[0]);show('.primary',slide.trio[1],captions[1]);show('.tertiary',slide.trio[2],captions[2]);}
    else{show('.primary',slide.scene);if(slide.paired)show('.secondary',slide.paired);}
    document.querySelector('.primary img').alt=slide.alt[lang];
    // Longer languages shrink the headline and subtitle instead of overflowing the safe area.
    const fit=(node,minimum)=>{let size=parseFloat(getComputedStyle(node).fontSize);while(node.scrollWidth>node.clientWidth&&size>minimum){size-=1;node.style.fontSize=size+'px';}};
    window.STORE_READY=Promise.all([document.fonts.ready,...[...document.images].filter(i=>i.src).map(i=>i.decode())]).then(()=>{fit(h1,isFeature?48:72);if(!isFeature)fit(subtitle,22);});
  </script>
</body>
</html>
