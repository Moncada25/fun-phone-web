name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check dependency security
        run: npm run check:security
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build with Astro
        run: npm run build
      - name: Verify discovery metadata and install attribution
        run: npm run check:discovery
      - name: Verify PWA artifacts and offline precache
        run: npm run check:pwa
      - name: Enforce Lighthouse and Web Vitals budgets
        id: lighthouse
        run: npm run check:lighthouse
      - name: Upload Lighthouse diagnostics
        if: ${{ failure() && steps.lighthouse.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: .lighthouse-reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
