name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [fun-phone-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      - name: Validate bundled release metadata
        run: npm run check:release
      - name: Build with Astro
        run: npm run build
        env:
          FUN_PHONE_RELEASE_MANIFEST_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.release) || '' }}
      - name: Verify discovery metadata and install attribution
        run: npm run check:discovery
      - name: Enforce Lighthouse and Web Vitals budgets
        run: npm run check:lighthouse
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
